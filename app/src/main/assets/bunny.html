<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beagle Overflow</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent;
    width: 100vw; height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  canvas {
    image-rendering: pixelated;
    transition: transform 0.3s ease;
  }
  #beagle.idle { transform: scale(1); }
  #beagle.blink { animation: blink 0.3s ease; }
  #beagle.love { transform: scale(1.15); }
  #beagle.angry { animation: shake 0.5s ease; }
  #beagle.talk { animation: bounce 0.6s ease; }
  #beagle.follow { transform: scale(1.05) rotate(-5deg); }
  #bubble {
    max-width: 160px;
    background: rgba(255,255,255,0.92);
    border-radius: 14px;
    padding: 6px 12px;
    margin-top: 2px;
    font-size: 12px;
    color: #555;
    text-align: center;
    display: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    word-break: break-word;
    font-family: sans-serif;
  }
  #bubble.show { display: block; }
  #bubble.love-bubble { background: #ffe0ec; color: #d6336c; }
  #bubble.angry-bubble { background: #ffe0e0; color: #cc3333; }
  @keyframes blink {
    0%,100% { transform: scaleY(1); }
    50% { transform: scaleY(0.1); }
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }
  @keyframes bounce {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }
</style>
</head>
<body>
<canvas id="beagle" class="idle" width="120" height="160"></canvas>
<div id="bubble"></div>
<script>
  const canvas = document.getElementById('beagle');
  const ctx = canvas.getContext('2d');
  const S = 4; // pixel scale
  let tailWag = 0;
  let earBounce = 0;
  let bounceOffset = 0;
  let isLove = false;
  let isAngry = false;
  let loveTimer = 0;

  function drawBeagle(ox, oy) {
    ctx.clearRect(0, 0, 120, 160);
    const s = S;

    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.fillRect(ox + 2, oy + 120 + bounceOffset, 76, 8);

    // -- body --
    ctx.fillStyle = '#8B5E3C';
    ctx.fillRect(ox + 12, oy + 52, 52, 44);
    ctx.fillRect(ox + 8, oy + 60, 60, 32);
    ctx.fillStyle = '#f5f0e8';
    ctx.fillRect(ox + 20, oy + 72, 40, 20);

    // -- legs --
    ctx.fillStyle = '#f5f0e8';
    ctx.fillRect(ox + 16, oy + 92, 12, 28);
    ctx.fillRect(ox + 52, oy + 92, 12, 28);
    ctx.fillStyle = '#8B5E3C';
    ctx.fillRect(ox + 16, oy + 112, 12, 8);
    ctx.fillRect(ox + 52, oy + 112, 12, 8);
    ctx.fillStyle = '#f5f0e8';
    ctx.fillRect(ox + 4, oy + 88, 12, 24);
    ctx.fillRect(ox + 64, oy + 88, 12, 24);
    ctx.fillStyle = '#8B5E3C';
    ctx.fillRect(ox + 4, oy + 108, 12, 8);
    ctx.fillRect(ox + 64, oy + 108, 12, 8);

    // -- tail --
    ctx.fillStyle = '#8B5E3C';
    const tailY = oy + 48 + Math.sin(tailWag * 0.15) * 3;
    ctx.fillRect(ox + 64, tailY, 8, 20);
    ctx.fillStyle = '#f5f0e8';
    ctx.fillRect(ox + 64, tailY, 8, 8);

    // -- head --
    ctx.fillStyle = '#8B5E3C';
    const headY = oy + 20 + earBounce;
    ctx.fillRect(ox + 16, headY, 48, 40);

    ctx.fillStyle = '#f5f0e8';
    ctx.fillRect(ox + 24, headY + 6, 8, 26);
    ctx.fillRect(ox + 48, headY + 6, 8, 26);
    ctx.fillRect(ox + 32, headY + 22, 16, 14);

    // -- ears --
    ctx.fillStyle = '#6B3F23';
    const earWag = Math.sin(earBounce * 0.1) * 2;
    ctx.fillRect(ox + 8, headY + earWag, 12, 28);
    ctx.fillRect(ox + 60, headY - earWag, 12, 28);

    // -- eyes --
    if (isLove) {
      // heart eyes
      ctx.fillStyle = '#e94560';
      ctx.fillRect(ox + 28, headY + 12, 8, 8);
      ctx.fillRect(ox + 44, headY + 12, 8, 8);
      ctx.fillStyle = '#ff8090';
      ctx.fillRect(ox + 32, headY + 12, 4, 4);
      ctx.fillRect(ox + 48, headY + 12, 4, 4);
    } else if (isAngry) {
      // angry eyes
      ctx.fillStyle = '#111';
      ctx.fillRect(ox + 28, headY + 12, 8, 6);
      ctx.fillRect(ox + 44, headY + 12, 8, 6);
      ctx.fillStyle = '#e94560';
      ctx.fillRect(ox + 30, headY + 12, 4, 4);
      ctx.fillRect(ox + 46, headY + 12, 4, 4);
    } else {
      ctx.fillStyle = '#111';
      ctx.fillRect(ox + 28, headY + 12, 8, 8);
      ctx.fillRect(ox + 44, headY + 12, 8, 8);
      ctx.fillStyle = '#fff';
      ctx.fillRect(ox + 32, headY + 12, 4, 4);
      ctx.fillRect(ox + 48, headY + 12, 4, 4);
    }

    // -- nose --
    ctx.fillStyle = '#111';
    ctx.fillRect(ox + 36, headY + 22, 10, 6);
    ctx.fillStyle = '#444';
    ctx.fillRect(ox + 40, headY + 22, 4, 2);

    // -- mouth --
    ctx.fillStyle = '#5a3020';
    if (isLove) {
      ctx.fillRect(ox + 36, headY + 32, 10, 4);
      ctx.fillRect(ox + 34, headY + 30, 4, 4);
      ctx.fillRect(ox + 44, headY + 30, 4, 4);
    } else if (isAngry) {
      ctx.fillRect(ox + 34, headY + 30, 14, 4);
    } else {
      ctx.fillRect(ox + 36, headY + 32, 10, 4);
    }

    // -- collar --
    ctx.fillStyle = '#e94560';
    ctx.fillRect(ox + 16, headY + 36, 48, 4);
    ctx.fillStyle = '#f5c518';
    ctx.fillRect(ox + 36, headY + 40, 8, 8);

    // love hearts
    if (isLove && loveTimer > 0) {
      ctx.fillStyle = '#e94560';
      const hx = ox + 36;
      const hy = headY - 12 - loveTimer;
      ctx.fillRect(hx, hy, 4, 4);
      ctx.fillRect(hx + 4, hy - 4, 4, 4);
      ctx.fillRect(hx + 8, hy, 4, 4);
      ctx.fillRect(hx + 4, hy, 4, 4);
      ctx.fillRect(hx + 4, hy + 4, 4, 4);
    }
  }

  function setBunny(expression, text) {
    var beagle = document.getElementById('beagle');
    var bubble = document.getElementById('bubble');
    beagle.className = expression;
    isLove = (expression === 'love');
    isAngry = (expression === 'angry');
    if (isLove) loveTimer = 8;
    if (text && text.length > 0) {
      bubble.textContent = text;
      bubble.className = 'show';
      if (expression === 'love') bubble.classList.add('love-bubble');
      else if (expression === 'angry') bubble.classList.add('angry-bubble');
      setTimeout(function() { bubble.className = ''; }, 3000);
    } else {
      bubble.className = '';
    }
  }

  function loop() {
    tailWag++;
    earBounce = Math.sin(tailWag * 0.08) * 2;
    bounceOffset = Math.abs(Math.sin(tailWag * 0.05)) * 1;
    if (loveTimer > 0) loveTimer -= 0.1;
    drawBeagle(6, 8);
    requestAnimationFrame(loop);
  }
  loop();
</script>
</body>
</html>
