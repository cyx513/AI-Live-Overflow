<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bunny Overflow</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent;
    width: 100vw; height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: sans-serif;
  }
  #bunny {
    width: 120px; height: 120px;
    transition: transform 0.3s ease;
  }
  #bunny.idle { transform: scale(1); }
  #bunny.blink { animation: blink 0.3s ease; }
  #bunny.love { transform: scale(1.2); }
  #bunny.angry { animation: shake 0.5s ease; }
  #bunny.talk { animation: bounce 0.6s ease; }
  #bunny.follow { transform: scale(1.05) rotate(-5deg); }
  #bubble {
    max-width: 160px;
    background: rgba(255,255,255,0.92);
    border-radius: 14px;
    padding: 6px 12px;
    margin-top: 4px;
    font-size: 12px;
    color: #555;
    text-align: center;
    display: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    word-break: break-word;
  }
  #bubble.show { display: block; }
  #bubble.love-bubble { background: #ffe0ec; color: #d6336c; }
  #bubble.angry-bubble { background: #ffe0e0; color: #cc3333; }
  @keyframes blink {
    0%,100% { transform: scaleY(1); }
    50% { transform: scaleY(0.1); }
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }
  @keyframes bounce {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }
</style>
</head>
<body>
<svg id="bunny" class="idle" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- ears -->
  <ellipse cx="35" cy="20" rx="12" ry="28" fill="#f5e6d3" stroke="#d4a574" stroke-width="2"/>
  <ellipse cx="85" cy="20" rx="12" ry="28" fill="#f5e6d3" stroke="#d4a574" stroke-width="2"/>
  <ellipse cx="35" cy="22" rx="7" ry="20" fill="#fce4d6"/>
  <ellipse cx="85" cy="22" rx="7" ry="20" fill="#fce4d6"/>
  <!-- face -->
  <circle cx="60" cy="65" r="35" fill="#f5e6d3" stroke="#d4a574" stroke-width="2"/>
  <!-- eyes -->
  <circle cx="47" cy="58" r="6" fill="#5c4033"/>
  <circle cx="73" cy="58" r="6" fill="#5c4033"/>
  <circle cx="49" cy="56" r="2" fill="white"/>
  <circle cx="75" cy="56" r="2" fill="white"/>
  <!-- nose -->
  <ellipse cx="60" cy="68" rx="5" ry="3.5" fill="#e8a0a0"/>
  <!-- mouth -->
  <path d="M54 74 Q60 80 66 74" fill="none" stroke="#5c4033" stroke-width="1.8" stroke-linecap="round"/>
  <!-- blush -->
  <circle cx="38" cy="68" r="7" fill="#ffd4d4" opacity="0.6"/>
  <circle cx="82" cy="68" r="7" fill="#ffd4d4" opacity="0.6"/>
</svg>
<div id="bubble"></div>
<script>
  function setBunny(expression, text) {
    var bunny = document.getElementById('bunny');
    var bubble = document.getElementById('bubble');
    bunny.className = expression;
    if (text && text.length > 0) {
      bubble.textContent = text;
      bubble.className = 'show';
      if (expression === 'love') bubble.classList.add('love-bubble');
      else if (expression === 'angry') bubble.classList.add('angry-bubble');
      setTimeout(function() { bubble.className = ''; }, 3000);
    } else {
      bubble.className = '';
    }
  }
</script>
</body>
</html>
